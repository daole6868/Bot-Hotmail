# Chống spam / DDoS tầng Nginx — chép vào /etc/nginx/conf.d/gachaz-shield.conf
# Chỉ khai báo "vùng đếm"; việc áp dụng nằm trong file site (nginx-gachaz.online.conf).
# Yêu cầu: đã cài cloudflare-realip.conf để $binary_remote_addr là IP thật của khách (không phải IP Cloudflare).

# Mỗi IP tối đa 15 yêu cầu / giây vào phần web động (ảnh, CSS, JS không tính)
limit_req_zone $binary_remote_addr zone=gz_req:20m rate=15r/s;
# Mỗi IP tối đa 40 kết nối mở cùng lúc
limit_conn_zone $binary_remote_addr zone=gz_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
