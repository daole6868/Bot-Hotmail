# Chống spam / DDoS tầng Nginx — chép vào /etc/nginx/conf.d/gachaz-shield.conf
# Chỉ khai báo "vùng đếm" và bộ nhớ đệm; việc áp dụng nằm trong file site (nginx-gachaz.online.conf).
# Yêu cầu: đã cài cloudflare-realip.conf để $binary_remote_addr là IP thật của khách (không phải IP Cloudflare).

# Mỗi IP tối đa 15 yêu cầu / giây vào phần web động (ảnh, CSS, JS không tính)
limit_req_zone $binary_remote_addr zone=gz_req:20m rate=15r/s;
# Mỗi IP tối đa 40 kết nối mở cùng lúc
limit_conn_zone $binary_remote_addr zone=gz_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# Microcache: trang công khai của khách chưa đăng nhập (web gửi kèm X-Accel-Expires) được giữ 2 giây.
# 10.000 người cùng mở trang chủ trong 1 giây -> Node chỉ dựng trang 1 lần.
proxy_cache_path /var/cache/nginx/gachaz levels=1:2 keys_zone=gz_micro:20m max_size=256m inactive=10m use_temp_path=off;
# Có cookie phiên (đã đăng nhập / đang thao tác) -> luôn hỏi thẳng web, không dùng bản lưu
map $http_cookie $gz_nocache {
    default 0;
    "~*(^|;\s*)sid=" 1;
}
# Tổng số yêu cầu đang xử lý cùng lúc của khách chưa đăng nhập (mọi IP cộng lại): vượt -> trang "đang đông" ngay,
# Node không bị nghẹt. Người đã đăng nhập (có cookie phiên) không bị tính -> vẫn mua hàng, nạp tiền bình thường.
map $gz_nocache $gz_guest_key {
    0 $server_name;
    1 "";
}
limit_conn_zone $gz_guest_key zone=gz_total:1m;
