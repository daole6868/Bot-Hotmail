# Nginx reverse proxy cho gachaz.online -> Node app (port 3200)
# Chép vào /etc/nginx/sites-available/gachaz.online rồi bật bằng symlink.
# Cần thêm deploy/nginx-shield.conf vào /etc/nginx/conf.d/ (khai báo vùng đếm gz_req, gz_conn, gz_total và bộ nhớ đệm gz_micro).
server {
    listen 80;
    listen [::]:80;
    server_name gachaz.online www.gachaz.online;

    # Cho phép upload ảnh sản phẩm (tối đa 10 ảnh x 8MB, web tự nén sau khi nhận)
    client_max_body_size 90m;

    # Cắt kết nối gửi chậm cố ý (kiểu tấn công slowloris giữ kết nối để làm nghẽn VPS)
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;

    # Trang "đang đông khách" (Nginx tự trả, không tốn gì của web) khi vượt giới hạn
    location = /busy.html {
        root /var/www/gachaz/public;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
    }

    location / {
        # Chống spam: 15 yêu cầu/giây/IP, cho dồn tạm tới 40 (người thật mở trang nhanh không bị chặn)
        limit_req zone=gz_req burst=40 nodelay;
        limit_conn gz_conn 40;
        # Khách chưa đăng nhập: cả web tối đa 400 yêu cầu đang xử lý cùng lúc (người đã đăng nhập không bị tính)
        limit_conn gz_total 400;
        error_page 429 /busy.html;

        # Microcache 2 giây cho trang khách chưa đăng nhập; Node lỗi / quá tải thì trả bản đã lưu
        proxy_cache gz_micro;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_bypass $gz_nocache;
        proxy_no_cache $gz_nocache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Micro-Cache $upstream_cache_status always;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Webhook nạp tiền (NIFY / SePay...): không giới hạn để không lỡ giao dịch; web tự kiểm tra chữ ký
    location = /api/bank/webhook {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ảnh upload & file tĩnh: Nginx phục vụ trực tiếp cho nhanh
    location /uploads/ {
        alias /var/www/gachaz/public/uploads/;
        # Tên file ảnh là ngẫu nhiên & không bao giờ ghi đè -> cho trình duyệt / Cloudflare nhớ lâu
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'";
    }
}
