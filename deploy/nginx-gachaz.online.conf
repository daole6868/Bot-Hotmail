# Nginx reverse proxy cho gachaz.online -> Node app (port 3200)
# Chép vào /etc/nginx/sites-available/gachaz.online rồi bật bằng symlink.
# Cần thêm deploy/nginx-shield.conf vào /etc/nginx/conf.d/ (khai báo vùng đếm gz_req, gz_conn).
server {
    listen 80;
    listen [::]:80;
    server_name gachaz.online www.gachaz.online;

    # Cho phép upload ảnh sản phẩm (tối đa 10 ảnh x 8MB, web tự nén sau khi nhận)
    client_max_body_size 90m;

    # Cắt kết nối gửi chậm cố ý (kiểu tấn công slowloris giữ kết nối để làm nghẽn VPS)
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;

    location / {
        # Chống spam: 15 yêu cầu/giây/IP, cho dồn tạm tới 40 (người thật mở trang nhanh không bị chặn)
        limit_req zone=gz_req burst=40 nodelay;
        limit_conn gz_conn 40;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Webhook nạp tiền (NIFY / SePay...): không giới hạn để không lỡ giao dịch; web tự kiểm tra chữ ký
    location = /api/bank/webhook {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ảnh upload & file tĩnh: Nginx phục vụ trực tiếp cho nhanh
    location /uploads/ {
        alias /var/www/gachaz/public/uploads/;
        # Tên file ảnh là ngẫu nhiên & không bao giờ ghi đè -> cho trình duyệt / Cloudflare nhớ lâu
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'";
    }
}
