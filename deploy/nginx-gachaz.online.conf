# Nginx reverse proxy cho gachaz.online -> Node app (port 3000)
# Chép vào /etc/nginx/sites-available/gachaz.online rồi bật bằng symlink.
server {
    listen 80;
    listen [::]:80;
    server_name gachaz.online www.gachaz.online;

    # Cho phép upload ảnh sản phẩm (tối đa 10 ảnh x 4MB)
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ảnh upload & file tĩnh: Nginx phục vụ trực tiếp cho nhanh
    location /uploads/ {
        alias /var/www/gachaz/public/uploads/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'";
    }
}
